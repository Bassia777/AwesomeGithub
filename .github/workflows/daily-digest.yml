name: GitHub Trending Daily Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: github-trending-daily
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run test suite
        run: python -m pytest

      - name: Generate and send digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: github-trending-digest

      - name: Commit successful history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          current_branch="$(git branch --show-current)"
          if [[ -z "$current_branch" || "$current_branch" != "$DEFAULT_BRANCH" ]]; then
            echo "Expected checked-out default branch '$DEFAULT_BRANCH', got '${current_branch:-detached HEAD}'."
            exit 1
          fi

          if [[ -z "$(git status --porcelain -- reports/history)" ]]; then
            echo "No history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/history

          if git diff --cached --quiet -- reports/history; then
            echo "No staged history changes to commit."
            exit 0
          fi

          git commit -m "chore: record daily trending digest"

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Push failed after $max_attempts attempts."
              exit 1
            fi

            echo "Push attempt $attempt failed; rebasing onto the latest default branch."
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Rebase failed; refusing to overwrite remote history."
              exit 1
            fi
          done
