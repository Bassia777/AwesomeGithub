name: GitHub Trending Daily Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_resend:
        description: Send again even if today's Shanghai-date history already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: github-trending-daily
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Run test suite
        run: python -m pytest

      - name: Check whether today's digest should run
        id: digest
        env:
          FORCE_RESEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend == true }}
        shell: bash
        run: |
          set -euo pipefail

          report_date="$(TZ=Asia/Shanghai date +%F)"
          history_path="reports/history/${report_date}.json"
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE_RESEND" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Force resend requested for $report_date; the digest will run."
          elif [[ -f "$history_path" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "History already exists at $history_path; skipping duplicate delivery."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No history exists for $report_date; the digest will run."
          fi

      - name: Generate and send digest
        if: steps.digest.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: github-trending-digest

      - name: Commit successful history
        id: history
        if: steps.digest.outputs.should_run == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          echo "has_commit=false" >> "$GITHUB_OUTPUT"
          current_branch="$(git branch --show-current)"
          if [[ -z "$current_branch" || "$current_branch" != "$DEFAULT_BRANCH" ]]; then
            echo "Expected checked-out default branch '$DEFAULT_BRANCH', got '${current_branch:-detached HEAD}'."
            exit 1
          fi

          if [[ -z "$(git status --porcelain -- reports/history)" ]]; then
            echo "No history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/history

          if git diff --cached --quiet -- reports/history; then
            echo "No staged history changes to commit."
            exit 0
          fi

          git commit -m "chore: record daily trending digest"
          echo "has_commit=true" >> "$GITHUB_OUTPUT"

      - name: Push successful history
        if: steps.digest.outputs.should_run == 'true' && steps.history.outputs.has_commit == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_branch="$(git branch --show-current)"
          if [[ -z "$current_branch" || "$current_branch" != "$DEFAULT_BRANCH" ]]; then
            echo "Expected checked-out default branch '$DEFAULT_BRANCH', got '${current_branch:-detached HEAD}'."
            exit 1
          fi

          gh auth setup-git

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Push failed after $max_attempts attempts."
              exit 1
            fi

            echo "Push attempt $attempt failed; rebasing onto the latest default branch."
            if ! git pull --rebase origin "$DEFAULT_BRANCH"; then
              git rebase --abort || true
              echo "Rebase failed; refusing to overwrite remote history."
              exit 1
            fi
          done
